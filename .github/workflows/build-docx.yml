name: Conversion des fiches en Word

on:
  push:
    branches: [main]
    paths: ['fiches/**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Convertir les fiches en .docx
        run: |
          mkdir -p docx
          for f in fiches/*.md; do
            base=$(basename "$f" .md)
            pandoc "$f" -o "docx/$base.docx"
          done
      - name: Committer les fichiers Word
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docx
          git diff --cached --quiet || git commit -m "Conversion Word des fiches"
          git push
